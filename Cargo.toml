[package]
name = "delta_fabric"
version = "0.7.2"
edition = "2024"
description = "Decentralized weight synchronization for distributed ML training with built-in networking"
license = "MIT"
repository = "https://github.com/JiraPit/DeltaFabric"
readme = "README.md"
keywords = ["machine-learning", "distributed", "decentralized", "zenoh", "burn"]
categories = ["science", "network-programming"]
include = ["/src", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[features]
default = []
burn = ["dep:burn"]
pytorch = ["pyo3"]

[dependencies]
anyhow = "1.0.102"
burn = { version = "0.20.1", optional = true, default-features = false, features = [
  "autodiff",
] }
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }
rkyv = { version = "0.8.15", features = ["unaligned"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zenoh = "1.9.0"

[package.metadata.docs.rs]
features = ["burn"]

[lib]
name = "delta_fabric"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
burn-tch = { version = "0.20.1", default-features = false }
burn-ndarray = { version = "0.20.1", default-features = false }
